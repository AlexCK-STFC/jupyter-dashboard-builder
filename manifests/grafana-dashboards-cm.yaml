apiVersion: v1
data:
  .gitkeep: ""
  activity.json: |
    {
       "editable": true,
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "panels": [ ],
             "repeat": "PROMETHEUS_DS",
             "title": "Activity ($PROMETHEUS_DS)",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Number of running user servers at any given time.\n\nNote that a single user could have multiple servers running if the\nJupyterHub is configured with `c.JupyterHub.allow_named_servers = True`.\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "lineInterpolation": "stepBefore",
                      "stacking": {
                         "mode": "normal"
                      }
                   },
                   "decimals": 0,
                   "min": 0
                }
             },
             "gridPos": {
                "h": 8,
                "w": 6,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "max(\n  jupyterhub_running_servers{namespace=~\"$hub\"}\n) by (namespace)\n",
                   "legendFormat": "{{ namespace }}"
                }
             ],
             "title": "Running Servers",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Number of unique users who were active within the preceding period.\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "lineInterpolation": "stepAfter",
                      "stacking": {
                         "mode": "normal"
                      }
                   },
                   "decimals": 0,
                   "min": 0
                }
             },
             "gridPos": {
                "h": 8,
                "w": 6,
                "x": 6,
                "y": 1
             },
             "id": 3,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "max(\n  jupyterhub_active_users{period=\"24h\", namespace=~\"$hub\"}\n) by (namespace)\n",
                   "legendFormat": "{{ namespace }}"
                }
             ],
             "title": "Daily Active Users",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Number of unique users who were active within the preceding period.\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "lineInterpolation": "stepAfter",
                      "stacking": {
                         "mode": "normal"
                      }
                   },
                   "decimals": 0,
                   "min": 0
                }
             },
             "gridPos": {
                "h": 8,
                "w": 6,
                "x": 12,
                "y": 1
             },
             "id": 4,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "max(\n  jupyterhub_active_users{period=\"7d\", namespace=~\"$hub\"}\n) by (namespace)\n",
                   "legendFormat": "{{ namespace }}"
                }
             ],
             "title": "Weekly Active Users",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Number of unique users who were active within the preceding period.\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "lineInterpolation": "stepAfter",
                      "stacking": {
                         "mode": "normal"
                      }
                   },
                   "decimals": 0,
                   "min": 0
                }
             },
             "gridPos": {
                "h": 8,
                "w": 6,
                "x": 18,
                "y": 1
             },
             "id": 5,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "max(\n  jupyterhub_active_users{period=\"30d\", namespace=~\"$hub\"}\n) by (namespace)\n",
                   "legendFormat": "{{ namespace }}"
                }
             ],
             "title": "Monthly Active Users",
             "type": "timeseries"
          }
       ],
       "schemaVersion": 39,
       "tags": [
          "jupyterhub"
       ],
       "templating": {
          "list": [
             {
                "hide": 1,
                "includeAll": true,
                "multi": true,
                "name": "PROMETHEUS_DS",
                "query": "prometheus",
                "type": "datasource"
             },
             {
                "allValue": ".*",
                "datasource": {
                   "type": "prometheus",
                   "uid": "${PROMETHEUS_DS}"
                },
                "includeAll": true,
                "multi": true,
                "name": "hub",
                "query": "label_values(kube_service_labels{service=\"hub\"}, namespace)",
                "type": "query"
             }
          ]
       },
       "time": {
          "from": "now-90d",
          "to": "now"
       },
       "timezone": "utc",
       "title": "Activity",
       "uid": "jhgd-activity"
    }
  cluster.json: |
    {
       "editable": true,
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "panels": [ ],
             "title": "Cluster Utilization",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Number of currently running users per hub.\n\nCommon shapes this visualization may take:\n1. A large number of users starting servers at exactly the same time will be\n  visible here as a single spike, and may cause stability issues. Since\n  they share the same cluster, such spikes happening on a *different* hub\n  may still affect your hub.\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "lineInterpolation": "stepAfter",
                      "stacking": {
                         "mode": "normal"
                      }
                   },
                   "decimals": 0,
                   "min": 0
                }
             },
             "gridPos": {
                "h": 10,
                "w": 12,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "# Sum up all running user pods by namespace\nsum(\n  # Grab a list of all running pods.\n  # The group aggregator always returns \"1\" for the number of times each\n  # unique label appears in the time series. This is desirable for this\n  # use case because we're merely identifying running pods by name,\n  # not how many times they might be running.\n  group(\n    kube_pod_status_phase{phase=\"Running\"}\n  ) by (pod)\n  * on (pod) group_right() group(\n    kube_pod_labels{label_app=\"jupyterhub\", label_component=\"singleuser-server\"}\n  ) by (namespace, pod)\n) by (namespace)\n",
                   "legendFormat": "{{namespace}}"
                }
             ],
             "title": "Running Users",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Number of nodes in each nodepool in this cluster\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "lineInterpolation": "stepAfter",
                      "stacking": {
                         "mode": "normal"
                      }
                   },
                   "decimals": 0,
                   "min": 0
                }
             },
             "gridPos": {
                "h": 10,
                "w": 12,
                "x": 12,
                "y": 1
             },
             "id": 3,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "# sum up all nodes by nodepool\nsum(\n  # kube_pod_labels comes from\n  # https://github.com/kubernetes/kube-state-metrics, and there is a particular\n  # label (kubernetes_node) that lists the node on which the kube-state-metrics pod\n  # s running! So that's totally irrelevant to these queries, but when a nodepool\n  # is rotated it caused there to exist two metrics with the same node value (which\n  # we care about) but different kubernetes_node values (because kube-state-metrics\n  # was running in a different node, even though we don't care about that). This\n  # group really just drops all labels except the two we care about to\n  # avoid messing things up.\n  group(\n    kube_node_labels\n  ) by (node, label_alpha_eksctl_io_nodegroup_name, label_cloud_google_com_gke_nodepool, label_kubernetes_azure_com_agentpool)\n) by (label_alpha_eksctl_io_nodegroup_name, label_cloud_google_com_gke_nodepool, label_kubernetes_azure_com_agentpool)\n",
                   "legendFormat": "{{label_alpha_eksctl_io_nodegroup_name}}{{label_cloud_google_com_gke_nodepool}}{{label_kubernetes_azure_com_agentpool}}"
                }
             ],
             "title": "Node Count",
             "type": "timeseries"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 11
             },
             "id": 4,
             "panels": [ ],
             "title": "Cluster Health",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Pods in a non-running state in the hub's namespace.\n\nPods stuck in non-running states often indicate an error condition\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "lineInterpolation": "stepAfter"
                   },
                   "min": 0
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Pending"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "fixedColor": "yellow",
                               "mode": "fixed"
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Running"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "fixedColor": "blue",
                               "mode": "fixed"
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Succeeded"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "fixedColor": "green",
                               "mode": "fixed"
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Unknown"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "fixedColor": "orange",
                               "mode": "fixed"
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Failed"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "fixedColor": "red",
                               "mode": "fixed"
                            }
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 10,
                "w": 12,
                "x": 0,
                "y": 12
             },
             "id": 5,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "sum(\n  kube_pod_status_phase{phase!=\"Running\"}\n) by (phase)\n",
                   "legendFormat": "{{phase}}"
                }
             ],
             "title": "Non Running Pods",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "This panel tracks pod terminations, for example, a pod being evicted from\na node under memory pressure. A Pod can, however, be in a \"Failed\" or\n\"Completed\" state without being listed here, for instance, if one of its\ncontainers exits with or without an error code.\n\nA pod termination reason can be either Evicted, NodeAffinity, NodeLost,\nShutdown, or UnexpectedAdmissionError.\n\n[Node-pressure eviction] is the process by which the kubelet proactively\nterminates pods to reclaim resources on nodes, such as memory. If you\nobserve pod evictions, consider adjusting the pod's [resource requests and\nlimits]. If a JupyterHub-started user-server pod is evicted, the user must\nrestart it manually via JupyterHub, which is a poor user experience to\navoid.\n\nAs this panel detects changes in pods' reported \"status.reason\", it can\nfail to detect pod terminations if the Pod is deleted quickly after it is\nterminated.\n\n[node-pressure eviction]: https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/\n[resource requests and limits]: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/\n",
             "fieldConfig": {
                "defaults": {
                   "min": 0
                }
             },
             "gridPos": {
                "h": 10,
                "w": 12,
                "x": 12,
                "y": 12
             },
             "id": 6,
             "options": {
                "sortBy": [
                   {
                      "desc": true,
                      "displayName": "Time"
                   }
                ]
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "count(\n  # kube_pod_status_reason's time series values can be either zero or\n  # one, but only when it is one do we have a pod termination reason to\n  # consider.\n  #\n  # ref: https://github.com/kubernetes/kube-state-metrics/blob/main/docs/metrics/workload/pod-metrics.md\n  #\n  kube_pod_status_reason == 1\n  unless\n  kube_pod_status_reason offset $__interval == 1\n) by (reason, namespace, pod)\n",
                   "format": "table"
                }
             ],
             "title": "Pod terminations",
             "transformations": [
                {
                   "id": "organize",
                   "options": {
                      "excludeByName": {
                         "Value": true
                      },
                      "indexByName": {
                         "Time": 0,
                         "namespace": 2,
                         "pod": 3,
                         "reason": 1
                      },
                      "orderByMode": "manual"
                   }
                }
             ],
             "type": "table"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "When a Kubernetes Pod's container exceeds its memory limit, the Linux\noom-killer terminates one or more of the container's high-memory\nprocesses. If the container's main process (PID 1) is terminated, the\ncontainer typically restarts automatically, as it is the default behavior\nfor k8s Pods' containers.\n\nHowever, if a non-main process is terminated, the container continues to\nrun. For example, a Jupyter server running as PID 1 might spawn multiple\nJupyter kernel processes. If the OOM killer terminates one of these kernel\nprocesses (because it consumed the most memory), only that kernel dies—the\ncontainer itself does not restart.\n\n---\n\nAs a Kubernetes administrator, you could check logs on the Kubernetes node\nfor details about what specific process was killed. You can see the\ncommand (like python or node), but not the full command-line arguments.\n\n```shell\n# access node via a very privileged pod\nkubectl debug node/<node-name> -it --image=docker.io/library/ubuntu --profile=sysadmin -- chroot /host bash\n\n# inspect relevant logs\ndmesg -T\n```\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "drawStyle": "points",
                      "fillOpacity": 10,
                      "lineInterpolation": "stepAfter",
                      "pointSize": 10
                   },
                   "min": 0
                }
             },
             "gridPos": {
                "h": 10,
                "w": 12,
                "x": 0,
                "y": 22
             },
             "id": 7,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "(\n  # oom kills are distinct events, so we want to see how many happened\n  # rather an average, to accomplish this we must do this subtraction\n  (\n    node_vmstat_oom_kill\n    -\n    node_vmstat_oom_kill offset $__interval\n  )\n  * on(node) group_left(label_alpha_eksctl_io_nodegroup_name, label_cloud_google_com_gke_nodepool, label_kubernetes_azure_com_agentpool)\n  group(\n    kube_node_labels\n  ) by (node, label_alpha_eksctl_io_nodegroup_name, label_cloud_google_com_gke_nodepool, label_kubernetes_azure_com_agentpool)\n) > 0\n",
                   "legendFormat": "{{label_alpha_eksctl_io_nodegroup_name}}{{label_cloud_google_com_gke_nodepool}}{{label_kubernetes_azure_com_agentpool}}/{{node}}"
                }
             ],
             "title": "Processes terminated by the out-of-memory killer, per node",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "This panel tracks the (init-)container termination reasons: OOMKilled,\nError, and ContainerStatusUnknown, excluding Completed.\n\nNote that container terminations that coincide with pod deletions may not\nbe detected because, after the pod deletion, the container termination reason is no\nlonger available.\n",
             "fieldConfig": {
                "defaults": {
                   "min": 0
                }
             },
             "gridPos": {
                "h": 10,
                "w": 12,
                "x": 12,
                "y": 22
             },
             "id": 8,
             "options": {
                "sortBy": [
                   {
                      "desc": true,
                      "displayName": "Time"
                   }
                ]
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "# container failures, reliably detected via restarts counter\nlabel_replace(\n  group(\n    kube_pod_container_status_restarts_total\n    -\n    (\n      kube_pod_container_status_restarts_total offset $__interval\n      or\n      kube_pod_container_status_restarts_total * 0\n    )\n    > 0\n  ) by (namespace, pod, container)\n  * on (namespace, pod, container) group_left(reason)\n  # topk ensures a single reason label if multiple were available during\n  # the time interval, while last_over_time helps us get the terminated\n  # reason more reliably\n  topk(1, last_over_time(kube_pod_container_status_last_terminated_reason{reason!=\"Completed\"}[$__interval])) by (namespace, pod, container),\n  \"restarted\", \"yes\", \"\", \"\"\n)\n",
                   "format": "table"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "# init-container failures, reliably detected via restarts counter\nlabel_replace(\n  group(\n    kube_pod_init_container_status_restarts_total\n    -\n    (\n      kube_pod_init_container_status_restarts_total offset $__interval\n      or\n      kube_pod_init_container_status_restarts_total * 0\n    )\n    > 0\n  ) by (namespace, pod, container)\n  * on (namespace, pod, container) group_left(reason)\n  # topk ensures a single reason label if multiple were available during\n  # the time interval, while last_over_time helps us get the terminated\n  # reason more reliably\n  topk(1, last_over_time(kube_pod_init_container_status_last_terminated_reason{reason!=\"Completed\"}[$__interval])) by (namespace, pod, container),\n  \"restarted\", \"yes\", \"\", \"\"\n)\n",
                   "format": "table"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "# remaining container terminations, not so reliably detected,\n# because pods can be removed shortly after a container termination,\n# and the termination reason needs to be scraped before that\nlabel_replace(\n  group(\n    kube_pod_container_status_terminated_reason{reason!=\"Completed\"} == 1\n    unless on (namespace, pod)\n    (\n      kube_pod_container_status_terminated_reason{reason!=\"Completed\"} offset $__interval == 1\n      or\n      kube_pod_container_status_restarts_total > 0\n    )\n  ) by (reason, namespace, pod, container),\n  \"restarted\", \"no\", \"\", \"\"\n)\n",
                   "format": "table"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "# remaining init-container terminations, not so reliably detected,\n# because pods can be removed shortly after a container termination,\n# and the termination reason needs to be scraped before that\nlabel_replace(\n  group(\n    kube_pod_init_container_status_terminated_reason{reason!=\"Completed\"} == 1\n    unless on (namespace, pod)\n    (\n      kube_pod_init_container_status_terminated_reason{reason!=\"Completed\"} offset $__interval == 1\n      or\n      kube_pod_init_container_status_restarts_total > 0\n    )\n  ) by (reason, namespace, pod, container),\n  \"restarted\", \"no\", \"\", \"\"\n)\n",
                   "format": "table"
                }
             ],
             "title": "Container terminations (only failures)",
             "transformations": [
                {
                   "id": "merge"
                },
                {
                   "id": "organize",
                   "options": {
                      "excludeByName": {
                         "Value #A": true,
                         "Value #B": true,
                         "Value #C": true,
                         "Value #D": true
                      },
                      "indexByName": {
                         "Time": 0,
                         "container": 4,
                         "namespace": 2,
                         "pod": 3,
                         "reason": 1,
                         "restarted": 5
                      },
                      "orderByMode": "manual"
                   }
                }
             ],
             "type": "table"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 32
             },
             "id": 9,
             "panels": [ ],
             "title": "Node Stats",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "% of available CPU currently in use\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "lineInterpolation": "stepAfter"
                   },
                   "max": 1,
                   "min": 0,
                   "unit": "percentunit"
                }
             },
             "gridPos": {
                "h": 10,
                "w": 12,
                "x": 0,
                "y": 33
             },
             "id": 10,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "(\n  sum(rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) by (node)\n  /\n  sum(kube_node_status_capacity{resource=\"cpu\"}) by (node)\n) * on (node) group_left(label_alpha_eksctl_io_nodegroup_name, label_cloud_google_com_gke_nodepool, label_kubernetes_azure_com_agentpool)\ngroup(\n  kube_node_labels\n) by (node, label_alpha_eksctl_io_nodegroup_name, label_cloud_google_com_gke_nodepool, label_kubernetes_azure_com_agentpool)\n",
