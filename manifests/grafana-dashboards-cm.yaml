             },
             "description": "Per group CPU requests\n\nThe measured unit are CPU cores, and they are written out with SI prefixes, so 100m means 0.1 CPU cores.\n\nUser groups are derived from authenticator managed groups where available, e.g. GitHub teams. If a user is a member of multiple groups, then they will be assigned to the group 'other' by default. \n\nRequires https://github.com/2i2c-org/jupyterhub-groups-exporter to\nbe set up. If the panels show no data, then please try selecting another time range where usage was active.\n",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "lineInterpolation": "stepAfter"
                   },
                   "min": 0,
                   "unit": "sishort"
                }
             },
             "gridPos": {
                "h": 12,
                "w": 24,
                "x": 0,
                "y": 48
             },
             "id": 5,
             "options": {
                "tooltip": {
                   "mode": "multi"
                }
             },
             "pluginVersion": "v11.1.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "$PROMETHEUS_DS"
                   },
                   "expr": "sum(\n\n  # sum pod containers' CPU requests, for each namespace and user combination\n  sum(\n    kube_pod_container_resource_requests{resource=\"cpu\", namespace=~\"$hub_name\", pod=~\"jupyter-.*\"}\n\n    # add an annotation_hub_jupyter_org_username label\n    * on (namespace, pod) group_left(annotation_hub_jupyter_org_username)\n    group(\n        kube_pod_annotations{namespace=~\"$hub_name\", annotation_hub_jupyter_org_username=~\".*\"}\n    ) by (namespace, pod, annotation_hub_jupyter_org_username)\n  ) by (namespace, annotation_hub_jupyter_org_username)\n\n  # make namespace/user combinations become more namespace/user/usergroup combinations\n  * on (namespace, annotation_hub_jupyter_org_username) group_right()\n  group(\n    # duplicate jupyterhub_user_group_info's username label as annotation_hub_jupyter_org_username\n    label_replace(\n      jupyterhub_user_group_info{namespace=~\"$hub_name\", username=~\".*\", usergroup=~\"$user_group\", usergroup!=\"multiple\"},\n      \"annotation_hub_jupyter_org_username\", \"$1\", \"username\", \"(.+)\"\n    )\n  ) by (namespace, annotation_hub_jupyter_org_username, usergroup)\n\n) by (namespace, usergroup)\n",
                   "legendFormat": "{{ usergroup }} - ({{ namespace }})"
                }
             ],
             "title": "CPU Requests",
             "type": "timeseries"
          }
       ],
       "schemaVersion": 39,
       "tags": [
          "jupyterhub"
       ],
       "templating": {
          "list": [
             {
                "hide": 1,
                "name": "PROMETHEUS_DS",
                "query": "prometheus",
                "type": "datasource"
             },
             {
                "allValue": ".*",
                "datasource": {
                   "type": "prometheus",
                   "uid": "${PROMETHEUS_DS}"
                },
                "includeAll": true,
                "multi": true,
                "name": "hub_name",
                "query": "label_values(kube_service_labels{service=\"hub\"}, namespace)",
                "type": "query"
             },
             {
                "allValue": ".*",
                "datasource": {
                   "type": "prometheus",
                   "uid": "${PROMETHEUS_DS}"
                },
                "includeAll": true,
                "multi": true,
                "name": "user_group",
                "query": "label_values(jupyterhub_user_group_info, usergroup)",
                "regex": "^(?!multiple$).+",
                "type": "query"
             }
          ]
       },
       "time": {
          "from": "now-6h",
          "to": "now"
       },
       "timezone": "utc",
       "title": "User Group Diagnostics Dashboard",
       "uid": "group-diagnostics-dashboard"
    }
